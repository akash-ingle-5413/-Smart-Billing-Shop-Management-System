<!DOCTYPE html>
<html>
<head>
    <title>RetailIQ - Select Role</title>
    <link rel="stylesheet" href="styleOne.css">
</head>

<body>

    <div class="container">

        <h1>🛒 RetailIQ</h1>
        <p>Smart Billing & Shop Management System</p>

        <h2>Who are you?</h2>


        <div class="cards">

            <!-- Shop Owner -->
            <div class="card owner">
                <div class="icon">🏪</div>

                <h3>Shop Owner</h3>

                <p>
                    Manage products,
                    billing, inventory
                    and analytics.
                </p>

                <button onclick="ownerPage()">
                    Continue as Owner
                </button>

            </div>



            <!-- Customer -->
            <div class="card customer">

                <div class="icon">🛒</div>

                <h3>Customer</h3>

                <p>
                    View bills,
                    order products
                    and track history.
                </p>


                <button onclick="customerPage()">
                    Continue as Customer
                </button>

            </div>


        </div>

    </div>

<script src="register.js"></script>
</body>
</html>
