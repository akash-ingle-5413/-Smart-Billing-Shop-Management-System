<!DOCTYPE html>
<html>
<head>
    <title>RetailIQ - Select Role</title>
    <link rel="stylesheet" href="styleOne.css">
</head>

<body>

<div class="container">

    <div class="logo">
        🛒
    </div>

    <h1>RetailIQ</h1>

    <p>Smart Billing & Shop Management System</p>

    <div class="login-card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to manage your shop
        </p>

        <form method="post" class="">

            <input
                type="email"
                placeholder="Email or Mobile Number"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Log In
            </button>

        </form>

        <a href="#" class="forgot">
            Forgot Password?
        </a>

        <div class="divider">
            <span>OR</span>
        </div>

        <button class="register-btn" onclick="registerPage()">
            Create New Account
        </button>

    </div>

</div>

<script src="register.js"></script>
</body>
</html>
