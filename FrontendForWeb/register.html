<!DOCTYPE html>
<html>
<head>
    <title>RetailIQ - Select Role</title>
    <link rel="stylesheet" href="styleOne.css">
</head>

<body>

<div class="logo">
    🛒
</div>

<h1>RetailIQ</h1>

<p>Smart Billing & Shop Management System</p>

<div class="login-card">

    <h2>Welcome Back</h2>

    <p class="subtitle">
        Login to manage your shop
    </p>


    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email or Mobile Number"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Log In
        </button>

    </form>


    <p id="message"></p>


    <a href="#" class="forgot">
        Forgot Password?
    </a>


    <div class="divider">

        <span>OR</span>

    </div>


    <button
        type="button"
        class="register-btn"
        onclick="registerPage()">

        Create New Account

    </button>

</div>


<script src="script.js"></script>
</body>
</html>
