name: Manual or Daily Commit

on:
  workflow_dispatch: # Allows you to trigger this manually with a single click
  schedule:
    - cron: '0 12 * * *' # Automatically runs every day at 12:00 UTC (Optional)

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_COMMIT_TOKEN }}

      - name: Make a change
        run: |
          echo "Last active update: $(date)" >> log.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "Auto Commit Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add log.txt
          git commit -m "Chore: daily automated update"
          git push
